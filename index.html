<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title> ICT SEATWORK 1 </title>
    <style>
         body {
            font-family: 'Helvetica', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #470101;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Helvetica', sans-serif;
            color: #470101;
            margin-bottom: 5px;
        }

        header p {
            margin-top: 0;
            color: #666;
        }

        
        main {
            background-color: white;
            max-width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        
        input[type="button"] {
            width: 96%;
            padding: 12px;
            background-color: #470101;
            color: white;
            border: none;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #000000;
        }

       
        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #777;
        }

    </style>
</head>
<body>
   <header>
    <div class="'reactor"></div>
    <h1>GLEE CLUB CHECKER</h1>
    <p>Candidate Verification System</p>
   </header>

   <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter your First Name"><br>
            <input type="text" id="last_name" placeholder="Enter your Last Name"><br>
            <input type="button" py-click="candidate_checker" value="Enter">
        </form>
        <div id="result"></div>
   </main>
   <footer>
    &copy: 2026 <span> Glee Club</span> &bull; Seatwork 1 &bull; 2nd Quarter
   </footer>
   
   <py-script src="main.py"></py-script>
</body>
</html>
